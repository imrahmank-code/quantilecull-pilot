name: 24/7 Daily Revenue & Commercial Briefing

on:
  schedule:
    - cron: '30 3 * * *' # Exactly 09:00:00 AM IST (03:30 UTC) 365 days/year
  workflow_dispatch:      # On-demand operator bypass

concurrency:
  group: daily-executive-briefing
  cancel-in-progress: false

jobs:
  dispatch-briefing:
    name: Execute Ground-Truth Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Resilient Dispatch Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_REPORT_EMAIL: ${{ secrets.ADMIN_REPORT_EMAIL || 'quantilecull.support@gmail.com' }}
          FOUNDER_EMAIL: ${{ secrets.FOUNDER_EMAIL || 'imrahman.k@gmail.com' }}
          OFFICIAL_SENDER_EMAIL: ${{ secrets.OFFICIAL_SENDER_EMAIL || 'QuantileCull Executive <support@quantilecull.com>' }}
        run: node scripts/dispatch_cloud_briefing.js
